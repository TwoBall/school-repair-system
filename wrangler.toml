name = "school-repair-system"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Cloudflare D1 分布式数据库绑定（在 Cloudflare 控制台新建 D1 数据库并绑定为 DB）
[[d1_databases]]
binding = "DB"
database_name = "school-repair-db"
database_id = "your-database-id-here"

# Cloudflare R2 对象存储桶绑定（用于永久存储报修现场图片与完工图片，0 流量费）
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "school-repair-photos"
