name = "school-repair-system"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# 提示：Cloudflare Pages 推荐直接在网页控制台中绑定 D1 与 R2（无需在文件中硬编码 UUID，避免部署校验报错）：
# 1. D1 数据库绑定：Pages 控制台 -> 设置 (Settings) -> 函数 (Functions) -> D1 数据库绑定 -> 变量名填 DB
# 2. R2 存储桶绑定：Pages 控制台 -> 设置 (Settings) -> 函数 (Functions) -> R2 存储桶绑定 -> 变量名填 PHOTOS

# 若您使用 Wrangler CLI 本地命令行发布，可填入在控制台生成的真实 D1 UUID 后取消下方注释：
# [[d1_databases]]
# binding = "DB"
# database_name = "school-repair-db"
# database_id = "填入真实UUID"

# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "school-repair-photos"
