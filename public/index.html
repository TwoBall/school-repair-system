<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<title>学校总务报修管理系统</title>
<style>
:root{
  --brand:#1677ff; --brand-d:#0d5fd0; --brand-l:#e8f2ff;
  --ok:#16a34a; --ok-l:#e8f7ee;
  --warn:#f59e0b; --warn-l:#fff6e5;
  --danger:#dc2626; --danger-l:#fdecec;
  --gray:#64748b; --line:#e2e8f0; --bg:#f4f6fa; --card:#fff; --txt:#1e293b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14.5px; line-height:1.55;
  padding-bottom:72px;
}
.wrap{max-width:960px;margin:0 auto;padding:0 12px}

/* topbar */
.topbar{background:linear-gradient(135deg,#1677ff,#0284c7);color:#fff;padding:12px 0 10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(22,119,255,.18)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tb-left{display:flex;align-items:center;gap:8px}
.tb-title{font-size:16.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.mode-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:12px;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;gap:4px}
.mode-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80}
.role-switch{display:flex;background:rgba(255,255,255,.18);border-radius:20px;padding:3px;gap:2px}
.role-switch button{border:0;background:transparent;color:#fff;font-size:12px;padding:4px 9px;border-radius:18px;cursor:pointer;white-space:nowrap;transition:all .15s}
.role-switch button.on{background:#fff;color:var(--brand);font-weight:700}
.role-status{font-size:11.5px;opacity:.9;display:flex;align-items:center;gap:6px}
.role-status a{color:#fff;text-decoration:underline;cursor:pointer}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 4px rgba(0,0,0,.04)}
.tabbar button{flex:1;border:0;background:none;padding:8px 0 7px;cursor:pointer;font-size:11.5px;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--brand);font-weight:700}
.tabbar .dot{font-size:15px;line-height:1}

/* cards & layout */
.card{background:var(--card);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(16,24,40,.06);border:1px solid rgba(226,232,240,.6)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;color:#0f172a}
.muted{color:var(--gray);font-size:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* form controls */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#334155}
.field label .req{color:var(--danger);margin-right:2px}
input[type=text],input[type=tel],input[type=password],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;background:#fff;color:var(--txt);font-family:inherit;
}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,119,255,.12)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:16px;font-size:12.5px;background:#fff;cursor:pointer;color:var(--txt);transition:all .15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.warn.on{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.danger.on{background:var(--danger);border-color:var(--danger);color:#fff}

/* buttons */
.btn{display:block;width:100%;padding:11px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:background .15s}
.btn:hover{filter:brightness(.95)}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:6px 10px;font-size:12px;width:auto;display:inline-block;border-radius:6px}
.btn.ok{background:var(--ok)} .btn.warn{background:var(--warn)} .btn.danger{background:var(--danger)}
.btn[disabled]{background:#cbd5e1;cursor:not-allowed;border-color:#cbd5e1}

/* photos */
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photos .ph{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f8fafc}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .del{position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 5px;cursor:pointer;border-radius:0 0 0 6px}
.addph{width:72px;height:72px;border:1px dashed #94a3b8;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gray);font-size:11px;cursor:pointer;background:#fafcff}
.addph:hover{border-color:var(--brand);color:var(--brand)}

/* ticket list item */
.tk{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;background:#fff;transition:border-color .15s}
.tk:hover{border-color:#93c5fd}
.tk.is-timeout{border-left:4px solid var(--danger)}
.tk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tk-no{font-size:12px;color:var(--gray);font-family:ui-monospace,Menlo,monospace}
.tk-title{font-weight:700;font-size:15px;margin:3px 0 4px}
.tk-meta{font-size:12px;color:var(--gray);line-height:1.6}
.tk-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.tk-thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tk-thumbs img{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}

/* badges */
.badge{font-size:11px;padding:2px 7px;border-radius:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.b-pending{background:var(--warn-l);color:#b45309}
.b-assigned{background:var(--brand-l);color:var(--brand-d)}
.b-working{background:#f3e8ff;color:#7c3aed}
.b-done{background:var(--ok-l);color:#15803d}
.b-closed{background:#eef1f6;color:#475569}
.b-rejected{background:var(--danger-l);color:var(--danger)}
.b-timeout{background:var(--danger-l);color:var(--danger);font-weight:700;animation:pulse 1.8s infinite}
.b-remind{background:#fee2e2;color:#b91c1c;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* kpi stats */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:11px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.kpi .v{font-size:20px;font-weight:800;line-height:1.2}
.kpi .k{font-size:11px;color:var(--gray);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.bar-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.bar-row .nm{width:80px;flex:none;color:var(--gray);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:14px;background:#eef2f8;border-radius:7px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#1677ff,#38bdf8);border-radius:7px}
.bar-row .vv{width:36px;flex:none;text-align:right;font-weight:700}

/* timeline */
.timeline{display:flex;flex-direction:column;gap:12px;margin:12px 0 6px;position:relative;padding-left:14px}
.timeline::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-14px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px var(--brand)}
.tl-head{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;color:#1e293b}
.tl-note{font-size:12px;color:var(--gray);margin-top:2px}

/* comments section */
.comments-box{background:#f8fafc;border-radius:9px;padding:10px;margin-top:10px;border:1px solid var(--line)}
.comment-item{padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.comment-item:last-child{border-bottom:0}
.comment-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--gray);margin-bottom:2px}
.comment-role{padding:1px 5px;border-radius:4px;font-size:10px;background:#e2e8f0;color:#334155}
.comment-role.admin{background:#dbeafe;color:#1d4ed8}
.comment-role.worker{background:#ede9fe;color:#6d28d9}

/* modal */
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:14px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;padding:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1)}
.modal-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.modal-head h3{margin:0;font-size:16px}
.modal-close{cursor:pointer;font-size:20px;color:var(--gray);border:0;background:none;padding:0 4px}

/* management table */
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.data-table th,.data-table td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
.data-table th{background:#f8fafc;color:var(--gray);font-weight:600}

/* toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}

/* print template styles */
@media print {
  body{background:#fff;color:#000;padding-bottom:0}
  .topbar,.tabbar,.role-switch,.modal-close,.btn,.no-print{display:none !important}
  .modal-mask{position:static;background:none;padding:0}
  .modal{max-width:100%;box-shadow:none;border:none;padding:0}
  .print-sheet{display:block !important;font-size:14px;line-height:1.6}
}
.print-sheet{display:none}
</style>
<script src="/js/qrcode.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="tb-left">
      <div class="tb-title" id="schoolName">学校总务报修系统</div>
      <div class="mode-tag" title="本地容器运行中">本地Docker</div>
    </div>
    <div class="role-switch" id="roleSwitch">
      <button class="on" data-role="reporter">报修人</button>
      <button data-role="worker">维修师傅</button>
      <button data-role="admin">总务处</button>
    </div>
  </div>
</div>

<div class="wrap" id="mainView" style="margin-top:10px"></div>
<div class="tabbar" id="tabbar"></div>
<div id="modalBox"></div>
<div id="toastBox"></div>

<script>
/* ==================== 全局状态与配置 ==================== */
var S = {
  role: 'reporter',         // reporter | worker | admin
  tab: 'form',             // 当前tab
  subTab: 'workers',       // 基础管理子tab: workers | buildings | categories | settings
  adminToken: localStorage.getItem('bx_admin_token') || '',
  adminName: '总务处管理员',
  workerToken: localStorage.getItem('bx_worker_token') || '',
  workerUser: JSON.parse(localStorage.getItem('bx_worker_user') || 'null'),
  myPhone: localStorage.getItem('bx_my_phone') || '',
  config: {
    schoolName: '学校总务报修服务中心',
    buildings: ['教学楼A栋','教学楼B栋','教学楼C栋','实验楼','图书馆','行政楼','食堂','体育馆','学生公寓1栋','学生公寓2栋'],
    categories: ['水电照明','门窗家具','空调风扇','给排水/卫浴','多媒体设备','墙面地面','电梯设施','其他'],
    workers: [],
    sla: { pendingHours:4, acceptHours:8, finishHours:24 }
  },
  tickets: [],             // 当前视图下的工单列表
  filterStatus: 'all',     // 工单大池状态筛选
  filterSearch: '',        // 搜索关键词
  filterUrgency: 'all',
  filterBuilding: 'all',
  filterCategory: 'all',
  filterTimeoutOnly: false,
  modal: null,
  uploading: false
};

var STATUS = {
  pending: { t: '待受理', c: 'b-pending' },
  assigned: { t: '已派工', c: 'b-assigned' },
  working: { t: '维修中', c: 'b-working' },
  done: { t: '待验收', c: 'b-done' },
  closed: { t: '已结单', c: 'b-closed' },
  rejected: { t: '已驳回', c: 'b-rejected' }
};

/* ==================== 统一 API 请求封装 ==================== */
function api(path, method, body, headers){
  method = method || 'GET';
  headers = headers || {};
  if(!headers['Content-Type'] && !(body instanceof FormData)){
    headers['Content-Type'] = 'application/json';
  }
  if(S.adminToken){
    headers['Authorization'] = 'Bearer ' + S.adminToken;
  } else if(S.workerToken){
    headers['Authorization'] = 'Bearer ' + S.workerToken;
  }
  var opts = { method: method, headers: headers };
  if(body){
    opts.body = (body instanceof FormData) ? body : JSON.stringify(body);
  }
  return fetch(path, opts).then(function(res){
    return res.json().then(function(json){
      if(!res.ok || json.ok === false){
        throw new Error(json.msg || '请求处理失败');
      }
      return json.data !== undefined ? json.data : json;
    });
  });
}

function toast(msg, cb){
  var box = document.getElementById('toastBox');
  box.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  setTimeout(function(){
    box.innerHTML = '';
    if(cb) cb();
  }, 2200);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function fmt(ts){
  if(!ts) return '--';
  var d = new Date(ts), p = function(v){ return (v<10?'0':'')+v; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function fmtShort(ts){
  if(!ts) return '--';
  var d = new Date(ts), p = function(v){ return (v<10?'0':'')+v; };
  return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ==================== 启动加载配置 ==================== */
function loadConfig(){
  return api('/api/config').then(function(cfg){
    S.config = cfg;
    document.getElementById('schoolName').textContent = cfg.schoolName || '学校总务报修系统';
  }).catch(function(e){
    console.warn('加载系统配置失败，使用默认配置:', e);
  });
}

/* ==================== 视图路由渲染 ==================== */
function refresh(){
  if(S.role === 'reporter'){
    if(S.tab === 'mine'){
      loadMineTickets().then(render);
    } else {
      render();
    }
  } else if(S.role === 'worker'){
    if(!S.workerToken){
      renderWorkerLogin();
      return;
    }
    loadWorkerTickets().then(render);
  } else if(S.role === 'admin'){
    if(!S.adminToken){
      renderAdminLogin();
      return;
    }
    if(S.tab === 'pool'){
      loadAllTickets().then(render);
    } else if(S.tab === 'dash'){
      loadStats().then(render);
    } else {
      render();
    }
  }
}

function render(){
  renderTabbar();
  var main = document.getElementById('mainView');
  if(S.role === 'reporter'){
    if(S.tab === 'form') main.innerHTML = formView();
    else if(S.tab === 'mine') main.innerHTML = mineView();
  } else if(S.role === 'worker'){
    if(!S.workerToken){ renderWorkerLogin(); return; }
    if(S.tab === 'workerTasks') main.innerHTML = workerTasksView();
    else if(S.tab === 'workerHistory') main.innerHTML = workerHistoryView();
  } else if(S.role === 'admin'){
    if(!S.adminToken){ renderAdminLogin(); return; }
    if(S.tab === 'pool') main.innerHTML = poolView();
    else if(S.tab === 'dash') main.innerHTML = dashView();
    else if(S.tab === 'manage') main.innerHTML = manageView();
    else if(S.tab === 'code') main.innerHTML = codeView();
  }
  bindEvents();
}

function renderTabbar(){
  var tb = document.getElementById('tabbar');
  var html = '';
  if(S.role === 'reporter'){
    html += '<button class="' + (S.tab==='form'?'on':'') + '" data-tab="form"><span class="dot">✏️</span><span>在线报修</span></button>';
    html += '<button class="' + (S.tab==='mine'?'on':'') + '" data-tab="mine"><span class="dot">📋</span><span>我的报修</span></button>';
  } else if(S.role === 'worker'){
    html += '<button class="' + (S.tab==='workerTasks'?'on':'') + '" data-tab="workerTasks"><span class="dot">🔧</span><span>待办任务</span></button>';
    html += '<button class="' + (S.tab==='workerHistory'?'on':'') + '" data-tab="workerHistory"><span class="dot">📜</span><span>完工历史</span></button>';
  } else if(S.role === 'admin'){
    html += '<button class="' + (S.tab==='pool'?'on':'') + '" data-tab="pool"><span class="dot">📑</span><span>工单大池</span></button>';
    html += '<button class="' + (S.tab==='dash'?'on':'') + '" data-tab="dash"><span class="dot">📊</span><span>数据看板</span></button>';
    html += '<button class="' + (S.tab==='manage'?'on':'') + '" data-tab="manage"><span class="dot">⚙️</span><span>基础配置</span></button>';
    html += '<button class="' + (S.tab==='code'?'on':'') + '" data-tab="code"><span class="dot">📱</span><span>报修码</span></button>';
  }
  tb.innerHTML = html;
}

/* ==================== 1. 报修人端视图 ==================== */
function formView(){
  var buildings = S.config.buildings || [];
  var categories = S.config.categories || [];
  var bHtml = buildings.map(function(b){ return '<option value="' + esc(b) + '">' + esc(b) + '</option>'; }).join('');
  var cHtml = categories.map(function(c, i){ return '<span class="chip ' + (i===0?'on':'') + '" data-val="' + esc(c) + '">' + esc(c) + '</span>'; }).join('');

  return '' +
  '<div class="card">' +
    '<h3><span>📝 快速提交报修</span><span class="muted">免注册 · 实时进度可查</span></h3>' +
    '<div class="row">' +
      '<div class="field">' +
        '<label><span class="req">*</span>报修楼栋</label>' +
        '<select id="f_bldg">' + bHtml + '</select>' +
      '</div>' +
      '<div class="field">' +
        '<label><span class="req">*</span>楼层 / 房间号</label>' +
        '<input type="text" id="f_room" placeholder="例如：305教室、412寝室">' +
      '</div>' +
    '</div>' +
    '<div class="field">' +
      '<label><span class="req">*</span>故障类别</label>' +
      '<div class="chips" id="f_cat_chips">' + cHtml + '</div>' +
    '</div>' +
    '<div class="field">' +
      '<label><span class="req">*</span>紧急程度</label>' +
      '<div class="chips" id="f_urg_chips">' +
        '<span class="chip on" data-val="普通">普通</span>' +
        '<span class="chip warn" data-val="较急">较急</span>' +
        '<span class="chip danger" data-val="紧急">紧急 (现场严重)</span>' +
      '</div>' +
    '</div>' +
    '<div class="field">' +
      '<label><span class="req">*</span>故障详情描述</label>' +
      '<textarea id="f_desc" placeholder="请详细描述故障现象、受损部位或现场特殊情况..."></textarea>' +
    '</div>' +
    '<div class="field">' +
      '<label>现场照片 (最多5张)</label>' +
      '<div class="photos" id="f_photos_box">' +
        '<label class="addph" id="f_upload_btn">' +
          '<span style="font-size:22px;line-height:1">📷</span>' +
          '<span>上传照片</span>' +
          '<input type="file" id="f_file_input" accept="image/*" style="display:none">' +
        '</label>' +
      '</div>' +
    '</div>' +
    '<div class="row">' +
      '<div class="field">' +
        '<label><span class="req">*</span>报修人姓名</label>' +
        '<input type="text" id="f_reporter" placeholder="您的姓名">' +
      '</div>' +
      '<div class="field">' +
        '<label><span class="req">*</span>联系电话 (查单凭证)</label>' +
        '<input type="tel" id="f_phone" maxlength="11" placeholder="11位手机号码" value="' + esc(S.myPhone) + '">' +
      '</div>' +
    '</div>' +

function renderBarRows(map, total){
  if(!map) return '<div class="muted">暂无数据</div>';
  var keys = Object.keys(map).sort(function(a,b){ return map[b] - map[a]; });
  if(keys.length === 0) return '<div class="muted">暂无数据</div>';
  var max = map[keys[0]] || 1;
  return keys.map(function(k){
    var v = map[k];
    var pct = Math.round((v / max) * 100);
    return '<div class="bar-row">' +
      '<div class="nm" title="' + esc(k) + '">' + esc(k) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="vv">' + v + '</div>' +
    '</div>';
  }).join('');
}

function renderWorkerStatRows(map){
  if(!map) return '<tr><td colspan="4" class="muted">暂无师傅统计</td></tr>';
  var keys = Object.keys(map);
  if(keys.length === 0) return '<tr><td colspan="4" class="muted">暂无师傅接单记录</td></tr>';
  return keys.map(function(k){
    var item = map[k];
    return '<tr>' +
      '<td><strong>' + esc(k) + '</strong></td>' +
      '<td>' + item.total + '</td>' +
      '<td style="color:var(--ok)">' + item.closed + '</td>' +
      '<td style="color:var(--warn)">' + item.working + '</td>' +
    '</tr>';
  }).join('');
}

function makeQR(text, box){
  try {
    box.innerHTML = '';
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var imgTag = qr.createImgTag(5, 10);
    box.innerHTML = '<div style="background:#fff;padding:12px;display:inline-block;border-radius:10px;border:1px solid var(--line)">' +
      imgTag +
      '<div style="margin-top:6px;font-size:12px;font-weight:600">' + esc(document.getElementById('qrBldgSelect').value + ' ' + document.getElementById('qrRoomInput').value) + '</div>' +
      '<div class="muted" style="font-size:11px">扫码一键报修</div>' +
    '</div>';
  } catch(e){
    box.innerHTML = '<div class="muted">二维码生成失败: ' + e.message + '</div>';
  }
}

/* ==================== 7. 单条工单卡片与详情弹窗 ==================== */
function renderTicketCard(t, viewRole){
  var st = STATUS[t.status] || { t: t.status, c: 'b-pending' };
  var timeoutBadge = t.isTimeout ? '<span class="badge b-timeout">⚠️ ' + esc(t.timeoutReason) + '</span>' : '';
  var remindBadge = (t.remindCount && t.remindCount > 0) ? '<span class="badge b-remind">🔔 催单(' + t.remindCount + ')</span>' : '';
  var urgColor = t.urgency === '紧急' ? 'color:var(--danger)' : t.urgency === '较急' ? 'color:var(--warn)' : '';

  var thumbs = '';
  if(t.photos && t.photos.length > 0){
    thumbs = '<div class="tk-thumbs">' + t.photos.map(function(p){
      return '<img src="' + esc(p) + '" onclick="viewImage(\'' + esc(p) + '\')">';
    }).join('') + '</div>';
  }

  var actions = '<button class="btn sm ghost" onclick="openDetailModal(\'' + esc(t.id) + '\')">查看详情</button> ';
  if(viewRole === 'admin'){
    if(t.status === 'pending' || t.status === 'assigned'){
      actions += '<button class="btn sm ok" onclick="openAssignModal(\'' + esc(t.id) + '\')">派单</button> ';
    }
    if(t.status === 'pending'){
      actions += '<button class="btn sm danger" onclick="openRejectModal(\'' + esc(t.id) + '\')">驳回</button> ';
    }
  } else if(viewRole === 'worker'){
    if(t.status === 'assigned'){
      actions += '<button class="btn sm ok" onclick="workerAcceptTicket(\'' + esc(t.id) + '\')">接单到场</button> ';
    }
    if(t.status === 'working'){
      actions += '<button class="btn sm ok" onclick="openFinishModal(\'' + esc(t.id) + '\')">完工提交</button> ';
    }
  } else if(viewRole === 'reporter'){
    if(t.status === 'done'){
      actions += '<button class="btn sm ok" onclick="openRateModal(\'' + esc(t.id) + '\')">验收评价</button> ';
    }
    if(t.status === 'pending' || t.status === 'assigned' || t.status === 'working'){
      actions += '<button class="btn sm warn" onclick="remindTicket(\'' + esc(t.id) + '\')">加急催单</button> ';
    }
  }

  return '' +
  '<div class="tk ' + (t.isTimeout ? 'is-timeout' : '') + '">' +
    '<div class="tk-head">' +
      '<div class="tk-no">' + esc(t.id) + '</div>' +
      '<div style="display:flex;gap:4px">' +
        remindBadge +
        timeoutBadge +
        '<span class="badge ' + st.c + '">' + st.t + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="tk-title">' + esc(t.building) + ' ' + esc(t.room) + '</div>' +
    '<div class="tk-meta">' +
      '<span>类别：' + esc(t.category) + '</span> | ' +
      '<span style="' + urgColor + '">紧急度：' + esc(t.urgency) + '</span> | ' +
      '<span>报修人：' + esc(t.reporter) + '</span><br>' +
      '<span>报修时间：' + fmt(t.createdAt) + '</span>' +
      (t.assignee ? ' | <span style="color:var(--brand)">师傅：' + esc(t.assignee) + '</span>' : '') +
    '</div>' +
    '<div style="margin-top:6px;font-size:13px;color:#334155">' + esc(t.desc) + '</div>' +
    thumbs +
    '<div class="tk-actions">' + actions + '</div>' +
  '</div>';
}

        '⏱️ SLA 超时预警：【' + esc(t.timeoutReason) + '】请尽快催办落实！</div>'

    var photoHtml = '';
    if(t.photos && t.photos.length > 0){
      photoHtml = '<div style="margin-top:8px"><strong>现场照片：</strong><div class="tk-thumbs" style="margin-top:4px">' +
        t.photos.map(function(p){ return '<img src="' + esc(p) + '" onclick="viewImage(\'' + esc(p) + '\')">'; }).join('') +
      '</div></div>';
    }

    var finishHtml = '';
    if(t.result){
      finishHtml = '<div style="background:#f0fdf4;border-radius:8px;padding:10px;margin-top:10px;font-size:13px">' +

      '</div>';
    }

    var ratingHtml = '';

      ratingHtml = '<div style="background:#fffbeb;border-radius:8px;padding:10px;margin-top:10px;font-size:13px">' +
        '<strong style="color:#b45309">验收评分：</strong>' + '⭐'.repeat(t.rating.score || 5) + ' (' + t.rating.score + '分)' +
        '<div style="margin-top:2px;color:var(--gray)">反馈：' + esc(t.rating.comment || '满意') + '</div>' +
      '</div>';
    }

    var tlHtml = '<div class="timeline">' + (t.timeline || []).map(function(item){
      return '<div class="tl-item">' +
        '<div class="tl-head"><span>' + esc(item.action) + ' (' + esc(item.by) + ')</span><span class="muted">' + fmtShort(item.t) + '</span></div>' +
        (item.note ? '<div class="tl-note">' + esc(item.note) + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';

    // 留言模块
    var comments = t.comments || [];
    var commHtml = '<div class="comments-box">' +
      '<div style="font-weight:600;font-size:13px;margin-bottom:6px">💬 现场沟通留言 (' + comments.length + ')</div>' +
      '<div id="commentListScroll">' +
        (comments.length === 0 ? '<div class="muted" style="padding:6px 0">暂无留言，各方可在下方沟通补充</div>' : comments.map(function(c){
          var roleCls = c.senderRole === 'admin' ? 'admin' : c.senderRole === 'worker' ? 'worker' : '';
          var roleName = c.senderRole === 'admin' ? '总务处' : c.senderRole === 'worker' ? '维修师傅' : '报修人';
          return '<div class="comment-item">' +
            '<div class="comment-meta"><span>' + esc(c.senderName) + ' <span class="comment-role ' + roleCls + '">' + roleName + '</span></span><span>' + fmtShort(c.createdAt) + '</span></div>' +
            '<div style="color:#1e293b">' + esc(c.content) + '</div>' +
          '</div>';
        }).join('')) +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-top:8px">' +
        '<input type="text" id="newCommentInput" placeholder="补充说明、约定到场时间等...">' +
        '<button class="btn sm" id="btnSendComment" style="flex:none;width:60px">发送</button>' +
      '</div>' +
    '</div>';

    var html = '' +
    '<div class="modal">' +
      '<div class="modal-head">' +
        '<h3>工单详情 ' + esc(t.id) + '</h3>' +
        '<button class="modal-close" onclick="closeModal()">×</button>' +
      '</div>' +
      timeoutAlert +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<div><span class="badge ' + st.c + '" style="font-size:12px">' + st.t + '</span> <strong style="font-size:15px;margin-left:4px">' + esc(t.building) + ' ' + esc(t.room) + '</strong></div>' +
        '<button class="btn sm ghost" onclick="printTicket(\'' + esc(t.id) + '\')">🖨️ 打印派工单</button>' +
      '</div>' +
      '<div style="font-size:13px;line-height:1.7;color:#334155;background:#f8fafc;padding:10px;border-radius:8px">' +
        '<div><strong>故障类别：</strong>' + esc(t.category) + ' | <strong>紧急程度：</strong>' + esc(t.urgency) + '</div>' +
        '<div><strong>报修人员：</strong>' + esc(t.reporter) + ' (' + esc(t.identity) + ') 📱 ' + esc(t.phone) + '</div>' +
        '<div><strong>提交时间：</strong>' + fmt(t.createdAt) + '</div>' +
        (t.assignee ? '<div><strong>维修责任人：</strong>' + esc(t.assignee) + '</div>' : '') +
        '<div style="margin-top:4px"><strong>故障描述：</strong>' + esc(t.desc) + '</div>' +
        photoHtml +
      '</div>' +
      finishHtml +
      ratingHtml +
      '<div style="margin-top:14px"><strong>工单全流程记录：</strong>' + tlHtml + '</div>' +
      commHtml +
    '</div>';

    openModal(html);

    // 绑定发送留言
    document.getElementById('btnSendComment').onclick = function(){
      var text = document.getElementById('newCommentInput').value.trim();
      if(!text) return;
      var role = S.role === 'admin' ? 'admin' : S.role === 'worker' ? 'worker' : 'reporter';
      var name = S.role === 'admin' ? '总务处' : S.role === 'worker' ? ((S.workerUser && S.workerUser.name) || '维修师傅') : (t.reporter || '报修人');
      api('/api/tickets/' + t.id + '/comments', 'POST', { senderRole: role, senderName: name, content: text }).then(function(){
        openDetailModal(t.id);
      }).catch(function(e){ toast(e.message); });
    };
  }).catch(function(e){
    toast('加载工单详情失败: ' + e.message);
  });
}

/* ==================== 8. 催单 / 派单 / 完工 / 评价弹窗 ==================== */
function remindTicket(id){
  var note = prompt('请输入催单说明（例如：现场影响教学、急需使用等）：', '急需使用，请尽快安排检修！');
  if(note === null) return;
  api('/api/tickets/' + id + '/remind', 'POST', { note: note }).then(function(res){
    toast('🔔 加急催单已通知总务处及维修师傅！');
    refresh();
  }).catch(function(e){
    toast(e.message);
  });
}

function openAssignModal(id){
  api('/api/config').then(function(cfg){
    var workers = cfg.workers || [];
    var options = workers.map(function(w){
      return '<option value="' + esc(w.name) + '">' + esc(w.name) + ' (' + esc(w.skill) + ' 📱' + esc(w.phone) + ')</option>';
    }).join('');

    var html = '' +
    '<div class="modal">' +
      '<div class="modal-head"><h3>指派维修师傅</h3><button class="modal-close" onclick="closeModal()">×</button></div>' +
      '<div class="field">' +

      '</div>' +
      '<div class="field">' +
        '<label>派单批注说明</label>' +

      '</div>' +
      '<button class="btn ok" id="btnConfirmAssign">确认派单</button>' +

      }).catch(function(e){ toast(e.message); });

function openRejectModal(id){

function openFinishModal(id){
  var finishPhotos = [];
  var html = '' +
  '<div class="modal">' +
    '<div class="modal-head"><h3>提交维修完工</h3><button class="modal-close" onclick="closeModal()">×</button></div>' +
    '<div class="field">' +
      '<label><span class="req">*</span>处理结果描述</label>' +
      '<textarea id="finishResultInput" placeholder="例如：已更换日光灯管及启辉器，通电测试运转正常..."></textarea>' +
    '</div>' +
    '<div class="field">' +
      '<label>完工现场照片 (最多3张)</label>' +
      '<div class="photos" id="finishPhotosBox">' +
        '<label class="addph" id="finishUploadBtn">' +
          '<span style="font-size:22px;line-height:1">📷</span>' +
          '<span>上传</span>' +
          '<input type="file" id="finishFileInput" accept="image/*" style="display:none">' +
        '</label>' +
      '</div>' +
    '</div>' +
    '<button class="btn ok" id="btnConfirmFinish">提交完工并通知验收</button>' +
  '</div>';

  openModal(html);

  document.getElementById('finishFileInput').onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    var fd = new FormData();
    fd.append('file', file);
    toast('正在上传图片...');
    api('/api/upload', 'POST', fd).then(function(res){
      finishPhotos.push(res.url);
      renderMiniPhotos('finishPhotosBox', finishPhotos, 'finishUploadBtn', 'finishFileInput');
      toast('图片上传成功');
    }).catch(function(err){ toast('上传失败: ' + err.message); });

  document.getElementById('btnConfirmFinish').onclick = function(){

    if(!resText){ toast('请填写维修处理结果'); return; }
    api('/api/tickets/' + id + '/finish', 'POST', { result: resText, photos: finishPhotos }).then(function(){
      toast('完工提交成功，已通知报修人验收！');
      closeModal();
      refresh();
    }).catch(function(e){ toast(e.message); });
  };
}

/* ==================== 10. Excel / CSV 报表导出 ==================== */
function exportCSV(){
  if(!S.tickets || S.tickets.length === 0){
    toast('当前列表无工单可导出');
    return;
  }
  var headers = ['工单单号','报修日期','楼栋','房间','故障类别','紧急度','报修人','联系电话','身份','当前状态','维修师傅','故障描述','处理结果','SLA超时','评分','评价内容'];
  var rows = [headers];

  for(var i=0; i<S.tickets.length; i++){
    var t = S.tickets[i];
    var st = STATUS[t.status] ? STATUS[t.status].t : t.status;
    var row = [
      t.id,
      fmt(t.createdAt),
      t.building,
      t.room,
      t.category,
      t.urgency,
      t.reporter,
      t.phone,
      t.identity,
      st,
      t.assignee || '',
      (t.desc || '').replace(/[\r\n]+/g, ' '),
      (t.result || '').replace(/[\r\n]+/g, ' '),
      t.isTimeout ? t.timeoutReason : '正常',
      t.rating ? t.rating.score : '',
      t.rating ? (t.rating.comment || '').replace(/[\r\n]+/g, ' ') : ''
    ];
    rows.push(row.map(function(cell){
      var s = String(cell == null ? '' : cell).replace(/"/g, '""');
      return '"' + s + '"';
    }));
  }

  // 加上 UTF-8 BOM 避免 Excel 打开中文乱码
  var csvContent = '\uFEFF' + rows.map(function(r){ return r.join(','); }).join('\r\n');
  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '总务报修工单导出_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('已生成 CSV 导出文件！');
}

/* ==================== 11. 弹窗与照片工具 ==================== */
function openModal(html){
  var box = document.getElementById('modalBox');
  box.innerHTML = '<div class="modal-mask" onclick="if(event.target===this)closeModal()">' + html + '</div>';
}
function closeModal(){
  document.getElementById('modalBox').innerHTML = '';
}
function viewImage(url){
  openModal('<div class="modal" style="text-align:center;padding:10px">' +
    '<img src="' + esc(url) + '" style="max-width:100%;max-height:80vh;border-radius:8px">' +
    '<div style="margin-top:10px"><button class="btn sm ghost" onclick="closeModal()">关闭大图</button></div>' +
  '</div>');
}

function renderMiniPhotos(boxId, photoList, addBtnId, inputId){
  var box = document.getElementById(boxId);
  if(!box) return;
  var items = photoList.map(function(p, idx){
    return '<div class="ph">' +
      '<img src="' + esc(p) + '" onclick="viewImage(\'' + esc(p) + '\')">' +
      '<span class="del" onclick="removePhoto(' + idx + ')">×</span>' +
    '</div>';
  }).join('');

  var btn = photoList.length < 5
    ? '<label class="addph" id="' + addBtnId + '">' +
        '<span style="font-size:22px;line-height:1">📷</span><span>上传</span>' +
        '<input type="file" id="' + inputId + '" accept="image/*" style="display:none">' +
      '</label>'
    : '';

  box.innerHTML = items + btn;
  bindPhotoUpload(inputId, photoList, boxId, addBtnId);
}

var formUploadedPhotos = [];
function removePhoto(idx){
  formUploadedPhotos.splice(idx, 1);
  renderMiniPhotos('f_photos_box', formUploadedPhotos, 'f_upload_btn', 'f_file_input');
}

function bindPhotoUpload(inputId, targetArr, boxId, addBtnId){
  var el = document.getElementById(inputId);
  if(!el) return;
  el.onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    var fd = new FormData();
    fd.append('file', file);
    toast('正在上传图片...');
    api('/api/upload', 'POST', fd).then(function(res){
      targetArr.push(res.url);
      renderMiniPhotos(boxId, targetArr, addBtnId, inputId);
      toast('图片上传成功');
    }).catch(function(err){
      toast('上传失败: ' + err.message);
    });
  };
}

/* ==================== 12. 事件绑定 ==================== */
function bindEvents(){
  // 角色切换
  var rs = document.getElementById('roleSwitch');
  rs.querySelectorAll('button').forEach(function(b){
    b.onclick = function(){
      var role = this.getAttribute('data-role');
      if(role === S.role) return;
      S.role = role;
      rs.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
      this.classList.add('on');
      if(role === 'reporter') S.tab = 'form';
      else if(role === 'worker') S.tab = 'workerTasks';
      else if(role === 'admin') S.tab = 'pool';
      refresh();
    };
  });

  // 底部Tab切换
  var tb = document.getElementById('tabbar');
  tb.querySelectorAll('button').forEach(function(b){
    b.onclick = function(){
      var tab = this.getAttribute('data-tab');
      if(tab === S.tab) return;
      S.tab = tab;
      refresh();
    };
  });

  // 基础管理二级 Tab
  var mTabs = document.getElementById('manageSubTabs');
  if(mTabs){
    mTabs.querySelectorAll('.chip').forEach(function(c){
      c.onclick = function(){
        S.subTab = this.getAttribute('data-sub');
        render();
      };
    });
  }

  // 基础管理各模块异步数据加载
  if(S.tab === 'manage'){
    if(S.subTab === 'workers'){
      loadWorkersList();
      var addWBtn = document.getElementById('btnAddWorkerBtn');
      if(addWBtn) addWBtn.onclick = openAddWorkerModal;
    } else if(S.subTab === 'buildings'){
      loadBuildingsList();
      var addBBtn = document.getElementById('btnAddBuildingBtn');
      if(addBBtn) addBBtn.onclick = openAddBuildingModal;
    } else if(S.subTab === 'categories'){
      loadCategoriesList();
      var addCBtn = document.getElementById('btnAddCategoryBtn');
      if(addCBtn) addCBtn.onclick = openAddCategoryModal;
    } else if(S.subTab === 'settings'){
      loadSettingsForm();
    }
  }

  // 报修人表单照片上传
  bindPhotoUpload('f_file_input', formUploadedPhotos, 'f_photos_box', 'f_upload_btn');

  // 表单芯片单选切换
  ['f_cat_chips','f_urg_chips','f_who_chips'].forEach(function(boxId){
    var box = document.getElementById(boxId);
    if(box){
      box.onclick = function(e){
        var chip = e.target.closest('.chip');
        if(!chip) return;
        box.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
        chip.classList.add('on');
      };
    }
  });

  // 报修提交
  var btnSub = document.getElementById('btnSubmitTicket');
  if(btnSub){
    btnSub.onclick = function(){
      var bldg = document.getElementById('f_bldg').value;
      var room = document.getElementById('f_room').value.trim();
      var desc = document.getElementById('f_desc').value.trim();
      var reporter = document.getElementById('f_reporter').value.trim();
      var phone = document.getElementById('f_phone').value.trim();
      var cat = (document.querySelector('#f_cat_chips .chip.on') || {}).innerText || '水电照明';
      var urg = (document.querySelector('#f_urg_chips .chip.on') || {}).innerText || '普通';
      var who = (document.querySelector('#f_who_chips .chip.on') || {}).innerText || '学生';

      if(!room){ toast('请填写楼层/房间号'); return; }
      if(!desc){ toast('请填写故障详情描述'); return; }
      if(!reporter){ toast('请填写联系人姓名'); return; }
      if(!/^1\d{10}$/.test(phone)){ toast('请填写正确的11位手机号码'); return; }

      btnSub.disabled = true;
      btnSub.textContent = '正在提交...';

      api('/api/tickets', 'POST', {
        building: bldg,
        room: room,
        category: cat,
        urgency: urg,
        desc: desc,
        reporter: reporter,
        phone: phone,
        identity: who,
        photos: formUploadedPhotos
      }).then(function(t){
        btnSub.disabled = false;
        btnSub.textContent = '立即提交报修申请';
        S.myPhone = phone;
        localStorage.setItem('bx_my_phone', phone);
        formUploadedPhotos = [];
        toast('🎉 报修提交成功！工单号：' + t.id, function(){
          S.tab = 'mine';
          refresh();
        });
      }).catch(function(e){
        btnSub.disabled = false;
        btnSub.textContent = '立即提交报修申请';
        toast(e.message || '提交失败');
      });
    };
  }

  // 查单
  var btnQ = document.getElementById('btnQueryMine');
  if(btnQ){
    btnQ.onclick = function(){
      var ph = document.getElementById('minePhoneInput').value.trim();
      if(!/^1\d{10}$/.test(ph)){ toast('请填写正确的11位手机号码'); return; }
      S.myPhone = ph;
      localStorage.setItem('bx_my_phone', ph);
      refresh();
    };
  }

  // 师傅退出 & 改密
  var btnOutW = document.getElementById('btnLogoutWorker');
  if(btnOutW){
    btnOutW.onclick = function(){
      S.workerToken = '';
      S.workerUser = null;
      localStorage.removeItem('bx_worker_token');
      localStorage.removeItem('bx_worker_user');
      refresh();
    };
  }
  var btnChgPwdW = document.getElementById('btnChangeWorkerPwd');
  if(btnChgPwdW){
    btnChgPwdW.onclick = function(){
      var oldP = prompt('请输入当前原密码：');
      if(!oldP) return;
      var newP = prompt('请输入新密码（不少于6位）：');
      if(!newP || newP.length < 6){ toast('新密码格式不符合要求'); return; }
      api('/api/auth/change-password', 'POST', { oldPassword: oldP, newPassword: newP }).then(function(){
        toast('密码修改成功，请牢记！');
      }).catch(function(e){ toast(e.message); });
    };
  }

  // 管理员退出
  var btnOutA = document.getElementById('btnLogoutAdmin');
  if(btnOutA){
    btnOutA.onclick = function(){
      S.adminToken = '';
      localStorage.removeItem('bx_admin_token');
      refresh();
    };
  }

  // 工单大池筛选
  var poolStChips = document.getElementById('poolStatusChips');
  if(poolStChips){
    poolStChips.onclick = function(e){
      var chip = e.target.closest('.chip');
      if(!chip) return;
      var st = chip.getAttribute('data-st');
      if(st === 'timeout'){
        S.filterTimeoutOnly = true;
        S.filterStatus = 'all';
      } else {
        S.filterTimeoutOnly = false;
        S.filterStatus = st;
      }
      refresh();
    };
  }
  var btnSearchPool = document.getElementById('btnSearchPool');
  if(btnSearchPool){
    btnSearchPool.onclick = function(){
      S.filterSearch = document.getElementById('poolSearch').value.trim();
      S.filterBuilding = document.getElementById('poolBuildingFilter').value;
      S.filterCategory = document.getElementById('poolCategoryFilter').value;
      refresh();
    };
  }

  // 看板超时卡片直接筛选
  var btnKpiTimeout = document.getElementById('btnKpiTimeout');
  if(btnKpiTimeout){
    btnKpiTimeout.onclick = function(){
      S.tab = 'pool';
      S.filterTimeoutOnly = true;
      S.filterStatus = 'all';
      refresh();
    };
  }

  // CSV 导出
  var btnExp = document.getElementById('btnExportCSV');
  if(btnExp) btnExp.onclick = exportCSV;

  // 生成报修码
  var btnGenQR = document.getElementById('btnGenQR');
  if(btnGenQR){
    btnGenQR.onclick = function(){
      var b = document.getElementById('qrBldgSelect').value;
      var r = document.getElementById('qrRoomInput').value.trim();
      var url = window.location.origin + window.location.pathname + '?bldg=' + encodeURIComponent(b) + '&room=' + encodeURIComponent(r);
      makeQR(url, document.getElementById('qrResultBox'));
    };
  }
}
